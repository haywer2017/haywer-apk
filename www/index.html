<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAYWER AI</title><style>*{box-sizing:border-box;margin:0;font-family:sans-serif}body{background:#0A0A0A;color:#fff;max-width:430px;margin:auto;padding-bottom:90px}header{background:#111;border-bottom:1px solid #8BCB2F;padding:14px;display:flex;justify-content:space-between}header b{font-size:18px}header b span{background:#8BCB2F;color:#111;padding:2px 8px;border-radius:8px}.hero{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}.card{background:#111;border:1.5px solid #8BCB2F;border-radius:18px;padding:16px;min-height:260px}.card h3{font-size:13px;margin:8px 0}.card p{color:#aaa;font-size:11px}.card label{display:block;font-size:11px;padding:7px 0}.card label input{accent-color:#8BCB2F}.card button{width:100%;padding:10px;border-radius:999px;border:none;font-weight:800;margin-top:10px;background:#8BCB2F}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#111;display:flex;justify-content:space-around;padding:12px}nav button{background:none;border:none;color:#aaa}nav button.active{color:#8BCB2F;font-weight:900}.page{display:none}.page.active{display:block}.chat{margin:16px;background:#111;border:1.5px solid #8BCB2F;border-radius:16px;padding:14px}.msg-ai{background:#1a1a1a;border:1px solid #8BCB2F;border-radius:12px;padding:10px;font-size:12px;margin:8px 0}.msg-me{background:#8BCB2F;color:#111;border-radius:12px;padding:10px;font-size:12px;margin:8px 0;text-align:left}.row{display:flex;gap:8px}.row input{flex:1;background:#1a1a1a;border:1px solid #333;color:#fff;border-radius:25px;padding:11px}.row button{background:#8BCB2F;border:none;border-radius:50%;width:44px;height:44px}</style><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111111"><link rel="icon" href="icon-192.png"></head><body>
<header><b>HAYWER <span>AI</span></b><div>🔔</div></header>
<div id="p-home" class="page active"><div class="hero"><h1>أهلاً بك في هايوار 👋</h1><p>اسأل Haywer AI عن أي خدمة...</p></div><div class="grid" id="g"></div></div>
<div id="p-ai" class="page"><div class="hero"><h1>Haywer AI 🤖</h1></div><div class="chat"><div class="msg-ai">أهلاً بك! أنا Haywer AI. اسألني عن شعار، متجر، حملة...</div><div id="box"></div><div class="row"><input id="inp" placeholder="اكتب رسالتك..."><button onclick="send()">➤</button></div></div></div>
<div id="p-ord" class="page"><div class="hero"><h1>طلباتي</h1></div><div class="chat"><div class="msg-ai"><b>تصميم شعار - قيد التنفيذ ⏳</b></div><div class="msg-ai"><b>حملة إعلانية - تم التسليم ✅</b></div></div></div>
<nav><button class="active" onclick="go('p-home',this)">🏠 الرئيسية</button><button onclick="go('p-ai',this)">🤖 Haywer AI</button><button onclick="go('p-ord',this)">🧾 طلباتي</button></nav>
<script>
var S=[["🚀","التسويق الإلكتروني","نمو حقيقي",["الإعلان الممول","إدارة الحملات","تحسين SEO"]],["🌐","تصميم المواقع","اختر ما تحتاجه",["مواقع تعريفية","متاجر إلكترونية","تحسين المواقع"]],["🎬","الإنتاج الإعلاني","فيديو يبيع",["فيديوهات إعلانية","موشن جرافيك","يوتيوب"]],["🖨️","الدعاية والطباعة","هوية تترك أثر",["شعار وهوية","بنر ورول أب","كروت وفواتير"]]];
var h="";S.forEach(function(s){h+='<div class="card"><div style="font-size:22px">'+s[0]+'</div><h3>'+s[1]+'</h3><p>'+s[2]+'</p>';s[3].forEach(function(x){h+='<label><input type="checkbox"> '+x+'</label>'});h+='<button onclick="alert(\'✅ تم إرسال طلبك - سيتواصل معك فريق هايوار\')">اطلب الخدمات ↗</button></div>'});document.getElementById('g').innerHTML=h;
function go(id,b){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(function(x){x.classList.remove('active')});b.classList.add('active')}
function send(){var i=document.getElementById('inp');var v=i.value.trim();if(!v)return;document.getElementById('box').innerHTML+='<div class="msg-me">'+v+'</div>';i.value='';var r='فهمت عليك ✅ فريق هايوار راح يتواصل معك على واتساب 718774843.';if(v.indexOf('شعار')>-1)r='ممتاز! لشعارك أقترح هوية خضراء #8BCB2F مع خط Tajawal، و3 نماذج خلال 24 ساعة.';if(v.indexOf('متجر')>-1)r='المتجر عندنا: تصميم سريع + ربط واتساب + دفع.';setTimeout(function(){document.getElementById('box').innerHTML+='<div class="msg-ai">'+r+'</div>'},500)}
</script></body></html>
